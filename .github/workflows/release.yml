name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: ''
          - goos: linux
            goarch: arm64
            suffix: ''
          - goos: linux
            goarch: arm
            goarm: 7
            suffix: ''
          - goos: darwin
            goarch: arm64
            suffix: ''
          - goos: windows
            goarch: amd64
            suffix: '.exe'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm || '' }}
          CGO_ENABLED: 0
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          GIT_COMMIT=$(git rev-parse --short=8 HEAD)
          BUILD_TIME=$(date +%FT%T%z)
          INTERNAL=github.com/comgunner/picoclaw/cmd/picoclaw/internal
          LDFLAGS="-X ${INTERNAL}.version=${VERSION} -X ${INTERNAL}.gitCommit=${GIT_COMMIT} -X ${INTERNAL}.buildTime=${BUILD_TIME} -s -w"
          BINARY=picoclaw-agents-${GOOS}-${GOARCH}${{ matrix.suffix }}
          go build -v -tags stdjson -ldflags "${LDFLAGS}" -o "build/${BINARY}" ./cmd/picoclaw

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: picoclaw-agents-${{ matrix.goos }}-${{ matrix.goarch }}
          path: build/picoclaw-agents-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
